spring.application.name=backend

# Database Configuration (Environment Driven)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT Configuration (secrets MUST be set via environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# iTunes Search API
itunes.api.base-url=${ITUNES_BASE_URL:https://itunes.apple.com}
itunes.api.timeout-ms=${ITUNES_TIMEOUT_MS:5000}

# Response caching (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
