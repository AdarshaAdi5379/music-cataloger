# Local development profile — uses H2 in-memory DB so PostgreSQL is not required.
# Start with: JWT_SECRET=<secret> ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:h2:mem:localdev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 console for inspecting data at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# JWT (still required from env)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# iTunes API
itunes.api.base-url=${ITUNES_BASE_URL:https://itunes.apple.com}
itunes.api.timeout-ms=${ITUNES_TIMEOUT_MS:5000}

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
