spring.application.name=backend-test

# In-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT test configuration (test-only secret, never used in production)
jwt.secret=test-only-jwt-secret-key-for-unit-tests-must-be-at-least-32-characters-long
jwt.expiration-ms=3600000

# iTunes API — overridden dynamically in ItunesApiClientTest via MockWebServer
itunes.api.base-url=https://itunes.apple.com
itunes.api.timeout-ms=2000

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1m
